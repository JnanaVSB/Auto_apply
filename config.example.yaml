# auto_apply settings template. Copy this file to data/config.yaml (git-ignored) and fill it in.

# Folder for the database and recovery file. A relative path counts from the project folder.
data_dir: data

# Which jobs to keep. A job matches when Simplify puts it in one of these categories, or one of the
# keywords appears as a whole word (capital letters ignored) in its title or description.
roles:
  simplify_categories: ["AI/ML/Data", "Data Science, AI & Machine Learning"]
  keywords: ["machine learning", "ML", "AI", "artificial intelligence", "reinforcement learning", "RL",
             "deep learning", "LLM", "research scientist", "applied scientist", "computer vision", "NLP"]

# Where jobs come from. Simplify's public GitHub lists change name each season (Summer2027 -> Summer2028).
# Every Greenhouse, Lever or Ashby board linked from them is read too; add more boards in extra_boards,
# e.g. ["greenhouse:openai", "ashby:anthropic", "lever:netflix"] (the name is the one in the board's web address).
sources:
  simplify_lists:
    - url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json
      level: intern
    - url: https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json
      level: new grad
  extra_boards: []
  # Other public GitHub job lists the phone book (python -m app.phonebook refresh) takes company boards from,
  # besides Simplify's lists. Add only lists whose licence allows it; these are MIT-licensed (checked 2026-10-23).
  phonebook_lists:
    - https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/dev/.github/scripts/listings.json
    - https://raw.githubusercontent.com/vanshb03/New-Grad-2027/dev/.github/scripts/listings.json
    - https://raw.githubusercontent.com/poteto/hiring-without-whiteboards/main/README.md

# While the dashboard (python -m app.web) is open, collect every this many hours (1 to 168). 0 = off.
collect_every_hours: 0
# While the dashboard is open, refresh the phone book every this many days (1 to 365; 30 = monthly). 0 = off.
phonebook_every_days: 30
# New requests per second to each job site (1 to 5). 1 is polite; each site is read on its own, all at once.
requests_per_second: 1

# Job scoring. The quick check passes a job with one of your keywords in its title, or with both its meaning match
# and its skill overlap at or above these thresholds (0 to 1); your answer key helps choose them.
scoring:
  meaning_threshold: 0.5  # almost any job ad scores 0.45 or more; the local AI does the fine filtering
  skills_threshold: 0.15  # the share of the job's listed skills that your resume has
  # Tools of your field that the O*NET skills list lacks, written as job ads write them. List them whether or not
  # you know them: the app checks your resume for the ones you have.
  extra_skills: ["MuJoCo", "CARLA", "SLURM", "ROS", "ROS 2", "Gazebo", "Isaac Sim", "Isaac Lab", "PyBullet",
                 "Gymnasium", "Stable-Baselines3", "RLlib", "JAX", "CUDA", "scikit-learn", "OpenCV", "MATLAB",
                 "Hugging Face", "Weights & Biases", "MLflow"]
  minutes_per_day: 120  # automatic AI scoring time per day (1 to 1440); then it continues the next day
  ready_threshold: 70  # an AI score from this up makes a job "ready for preparation"; below it, "low score"
  automatic: true  # while the dashboard is open, score new, changed and waiting jobs by itself (false: on request)

# The AI model for each role. Phase 3b uses only the evaluator, which scores jobs on this computer through Ollama:
# nothing leaves the laptop. service: ollama, openai-compatible or anthropic; a cloud service also needs key_name, the
# name its key is saved under in your keychain (never the key itself). thinking: "off", "low", "medium" or "high"
# (keep the quotes). context: Ollama's working size in word-pieces; the whole resume and job ad must fit in it.
ai:
  evaluator:
    service: ollama
    model: gemma4:26b-a4b-it-q8_0
    address: http://127.0.0.1:11434
    thinking: "off"
    context: 16384
