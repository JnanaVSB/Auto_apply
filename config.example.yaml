# auto_apply settings template. Copy this file to data/config.yaml (git-ignored) and fill it in.

# Folder for the database and recovery file. A relative path counts from the project folder.
data_dir: data

# Which jobs to keep. A job matches when Simplify puts it in one of these categories, or one of the
# keywords appears as a whole word (capital letters ignored) in its title or description.
roles:
  simplify_categories: ["AI/ML/Data", "Data Science, AI & Machine Learning"]
  keywords: ["machine learning", "ML", "AI", "artificial intelligence", "reinforcement learning", "RL",
             "deep learning", "LLM", "research scientist", "applied scientist", "computer vision", "NLP"]

# Where jobs come from. Simplify's public GitHub lists change name each season (Summer2027 -> Summer2028).
# Every Greenhouse, Lever or Ashby board linked from them is read too; add more boards in extra_boards,
# e.g. ["greenhouse:openai", "ashby:anthropic", "lever:netflix"] (the name is the one in the board's web address).
sources:
  simplify_lists:
    - url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json
      level: intern
    - url: https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json
      level: new grad
  extra_boards: []
  # Other public GitHub job lists the phone book (python -m app.phonebook refresh) takes company boards from,
  # besides Simplify's lists. Add only lists whose licence allows it; these are MIT-licensed (checked 2026-10-23).
  phonebook_lists:
    - https://raw.githubusercontent.com/vanshb03/Summer2027-Internships/dev/.github/scripts/listings.json
    - https://raw.githubusercontent.com/vanshb03/New-Grad-2027/dev/.github/scripts/listings.json
    - https://raw.githubusercontent.com/poteto/hiring-without-whiteboards/main/README.md

# While the dashboard (python -m app.web) is open, collect every this many hours (1 to 168). 0 = off.
collect_every_hours: 0
