# Conda environment for auto_apply. Create it with: conda env create -f environment.yml
# Versions are pinned so every user gets the same setup; upgrades need owner approval.
name: auto_apply
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12.14
  - pip=26.2.1
  - go=1.25.14  # builds gitleaks for the pre-commit secret scan
  - pre-commit=4.6.2
  - pydantic=2.13.5
  - pyyaml=6.0.3
  - keyring=25.7.0
  - httpx=0.28.1  # web downloads (job lists and job-board APIs)
  - fastapi-core=0.141.1  # dashboard web app (FastAPI without its optional extras)
  - starlette=1.6.0  # the web toolkit FastAPI is built on
  - uvicorn=0.53.0  # local web server for the dashboard
  - jinja2=3.1.6  # dashboard page templates
  - rapidfuzz=3.14.6  # job scoring: keywords and skills, including spelling variants
  - numpy=2.5.4  # job scoring: maths for the meaning match
  - onnxruntime=1.31.0=*_0_cpu  # job scoring: runs the meaning model on the processor (not the 280 MB GPU build)
  - tokenizers=0.23.3  # job scoring: splits text into the word-pieces the meaning model reads
  - pytest=9.1.1
  - ruff=0.16.10
  - pip:
      - -r requirements-pip.txt  # sqlcipher3, pinned by SHA-256 fingerprint
