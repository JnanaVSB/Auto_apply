<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# HTMX without anything the safety rules forbid; it keeps no copies of pages in the browser's storage #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "selfRequestsOnly": true, "historyCacheSize": 0}'>
  <title>{% block title %}Jobs{% endblock %} · auto_apply</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body{% if csrf %} hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'{% endif %}>
  {% if csrf %}
  <header>
    <nav>
      <a href="/">Jobs</a>
      <a href="/add">Add</a>
      <a href="/collect">Collect</a>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf }}">
        <button type="submit">Log out</button>
      </form>
    </nav>
  </header>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
