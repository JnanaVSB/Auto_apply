<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<!-- auto_apply's own line drawings for the sign-in page's background, drawn by hand for this app: a resume, a cover
     letter in its envelope, a paper plane, a checklist, a briefcase, a calendar, a pen, a magnifier over a job ad,
     and a few sparks. Used only as a CSS mask, so the lines take the page's ink colour. Decorative; no text. -->

<!-- resume, top left -->
<g transform="translate(86 74) rotate(-8)">
  <path d="M2 4 Q1 2 4 1 L118 0 Q121 0 121 4 L122 156 Q122 160 118 160 L5 161 Q1 161 1 157 Z"/>
  <circle cx="30" cy="34" r="14"/>
