  <path d="M56 26 L104 25 M56 38 L94 38"/>
  <path d="M16 74 L106 73 M16 88 L100 88 M16 102 L106 101 M16 116 L84 116"/>
  <path d="M16 134 L60 134 M70 134 L104 133"/>
</g>

<!-- envelope with a letter, top right -->
<g transform="translate(930 92) rotate(7)">
  <path d="M14 -26 L134 -28 L136 40 M14 -26 L14 30"/>
  <path d="M34 -8 L114 -9 M34 6 L104 6"/>
  <path d="M1 22 Q0 18 4 18 L146 17 Q150 17 150 21 L151 104 Q151 108 147 108 L5 109 Q1 109 1 105 Z"/>
  <path d="M3 21 L76 70 L148 20"/>
  <path d="M3 106 L58 60 M149 106 L95 60"/>
</g>

<!-- paper plane with its trail, upper middle (its trail passes under the card's top edge) -->
