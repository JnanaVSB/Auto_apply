  <path d="M54 92 L94 91"/>
  <path d="M22 128 h18 v18 h-18 Z"/>
  <path d="M54 138 L100 137"/>
</g>

<!-- briefcase, right middle -->
<g transform="translate(1000 380) rotate(-6)">
  <path d="M2 30 Q1 24 8 24 L142 23 Q148 23 148 30 L149 116 Q149 122 142 122 L8 123 Q2 123 2 116 Z"/>
